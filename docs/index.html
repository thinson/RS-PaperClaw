<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RS-PaperClaw</title>
    <style>
      :root {
        --bg: #f4efe7;
        --panel: rgba(255, 251, 245, 0.88);
        --line: rgba(58, 43, 28, 0.12);
        --text: #2d2419;
        --muted: #6a5a48;
        --accent: #b55f34;
        --accent-soft: rgba(181, 95, 52, 0.12);
        --shadow: 0 20px 40px rgba(83, 58, 36, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC",
          serif;
        color: var(--text);
        overflow-x: hidden;
        background:
          radial-gradient(circle at top left, #fce8cb 0, transparent 28%),
          radial-gradient(circle at right, #dfefe6 0, transparent 26%),
          linear-gradient(180deg, #f8f3ea 0%, #f3ede3 100%);
      }

      .shell {
        max-width: 1360px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .hero {
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.8rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .hero-copy {
        min-width: 0;
      }

      .hero-title-row {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .hero-brand {
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .hero-logo {
        flex: 0 0 auto;
        width: 68px;
        height: 68px;
        object-fit: contain;
        filter: drop-shadow(0 12px 22px rgba(57, 41, 26, 0.14));
      }

      .hero-copy p {
        margin: 12px 0 0;
        max-width: 720px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .hero-news {
        display: inline-block;
        margin-top: 8px;
        color: var(--accent);
        font-size: 0.92rem;
        text-decoration: underline;
      }

      .hero-news:hover {
        text-decoration: underline;
      }

      .repo-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border: 1px solid rgba(58, 43, 28, 0.1);
        border-radius: 18px;
        background: rgba(255, 252, 247, 0.92);
        color: var(--text);
        text-decoration: none;
        box-shadow: 0 18px 36px rgba(57, 41, 26, 0.08);
      }

      .repo-link:hover {
        border-color: rgba(181, 95, 52, 0.34);
        color: var(--accent);
      }

      .repo-meta {
        display: grid;
        gap: 2px;
      }

      .repo-meta strong {
        font-size: 1rem;
      }

      .repo-meta span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 20px;
        margin-top: 20px;
        min-width: 0;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: var(--shadow);
        min-width: 0;
      }

      .sidebar {
        padding: 18px;
        position: sticky;
        top: 20px;
        align-self: start;
        min-width: 0;
        max-height: calc(100vh - 40px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .sidebar h2,
      .content h2 {
        margin: 0 0 14px;
        font-size: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .summary {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .report-list {
        display: grid;
        gap: 10px;
        min-width: 0;
        overflow-y: auto;
        padding-top: 2px;
        padding-right: 4px;
      }

      .report-item {
        appearance: none;
        width: 100%;
        font: inherit;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fffdf8;
        color: var(--text);
        cursor: pointer;
        transition: transform 160ms ease, border-color 160ms ease,
          background 160ms ease;
      }

      .report-item:hover {
        transform: translateY(-1px);
      }

      .report-item:hover,
      .report-item.active {
        border-color: rgba(181, 95, 52, 0.4);
        background: #fff7ee;
      }

      .report-item strong {
        display: block;
        margin-bottom: 4px;
        font-size: 1rem;
      }

      .report-item span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .report-item.more {
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-decoration: none;
        text-align: center;
      }

      .content {
        padding: 22px;
        min-width: 0;
      }

      .report-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: start;
        margin-bottom: 18px;
      }

      .report-head h3 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.6rem);
      }

      .report-head a {
        color: var(--accent);
        text-decoration: none;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .stat {
        padding: 14px 16px;
        border-radius: 18px;
        background: var(--accent-soft);
      }

      .stat strong {
        display: block;
        margin-bottom: 6px;
        font-size: 1.4rem;
      }

      .section {
        margin-bottom: 20px;
      }

      .section p {
        margin: 0 0 10px;
        color: var(--text);
        line-height: 1.7;
      }

      .highlights {
        margin: 0;
        padding-left: 20px;
        color: var(--text);
        line-height: 1.7;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 18px;
        background: #fffdf8;
      }

      .table-wrap {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .table-wrap table {
        width: 100%;
        min-width: 0;
        table-layout: fixed;
      }

      .papers-mobile {
        display: none;
      }

      .paper-card {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fffdf8;
      }

      .paper-card + .paper-card {
        margin-top: 12px;
      }

      .paper-card-row + .paper-card-row {
        margin-top: 10px;
      }

      .paper-card-label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .paper-card-value {
        line-height: 1.65;
      }

      th,
      td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 0.95rem;
        overflow-wrap: anywhere;
      }

      th {
        background: rgba(45, 36, 25, 0.04);
      }

      .col-title {
        width: 32%;
        min-width: 0;
      }

      .col-authors {
        width: 23%;
        min-width: 0;
      }

      .col-institution {
        width: 15%;
        min-width: 140px;
        max-width: 180px;
      }

      .col-summary {
        width: 30%;
        min-width: 0;
      }

      .paper-col-institution,
      .paper-card-value.institution {
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .institution-text {
        display: -webkit-box;
        white-space: normal;
        overflow: hidden;
        text-overflow: ellipsis;
        overflow-wrap: anywhere;
        word-break: break-word;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }

      a {
        color: var(--accent);
      }

      .empty,
      .status {
        padding: 24px;
        border-radius: 18px;
        background: #fffdf8;
        color: var(--muted);
      }

      .paper-row {
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }

      .paper-row:hover {
        background: #fff7ee;
      }

      .paper-title {
        display: grid;
        gap: 6px;
      }

      .paper-title strong {
        font-size: 0.98rem;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .paper-hint {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(181, 95, 52, 0.1);
        color: var(--accent);
        font-size: 0.78rem;
        letter-spacing: 0.02em;
      }

      .paper-card.clickable {
        cursor: pointer;
        transition: transform 160ms ease, border-color 160ms ease,
          background 160ms ease;
      }

      .paper-card.clickable:hover {
        transform: translateY(-1px);
        border-color: rgba(181, 95, 52, 0.34);
        background: #fff7ee;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 40;
      }

      .overlay.open {
        display: block;
      }

      .overlay-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(33, 23, 14, 0.46);
        backdrop-filter: blur(8px);
      }

      .detail-sheet {
        position: absolute;
        inset: 18px;
        overflow: auto;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 249, 241, 0.98), rgba(248, 241, 231, 0.96)),
          radial-gradient(circle at top right, rgba(214, 234, 223, 0.7), transparent 24%);
        box-shadow: 0 32px 80px rgba(26, 18, 10, 0.28);
      }

      .detail-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 22px 40px;
      }

      .detail-topbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }

      .back-button,
      .ghost-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 252, 248, 0.92);
        color: var(--text);
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .back-button:hover,
      .ghost-link:hover {
        border-color: rgba(181, 95, 52, 0.35);
        color: var(--accent);
      }

      .detail-hero {
        padding: 24px;
        border: 1px solid rgba(58, 43, 28, 0.08);
        border-radius: 26px;
        background:
          radial-gradient(circle at top left, rgba(255, 229, 190, 0.7), transparent 26%),
          linear-gradient(160deg, rgba(255, 253, 249, 0.96), rgba(250, 244, 235, 0.94));
        box-shadow: var(--shadow);
      }

      .detail-kicker {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.92rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .detail-title {
        margin: 0;
        font-size: clamp(1.9rem, 4vw, 3.3rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .detail-subtitle {
        margin: 14px 0 0;
        max-width: 900px;
        color: var(--muted);
        line-height: 1.75;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(181, 95, 52, 0.1);
        color: var(--accent);
        font-size: 0.9rem;
      }

      .detail-hero .tag-row {
        justify-content: center;
      }

      .detail-hero .tag-row a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(181, 95, 52, 0.18);
        background: rgba(181, 95, 52, 0.08);
        color: var(--accent);
        text-decoration: none;
        font-size: 0.94rem;
      }

      .detail-hero .tag-row a:hover {
        border-color: rgba(181, 95, 52, 0.38);
        background: rgba(181, 95, 52, 0.12);
      }

      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        margin-top: 18px;
      }

      .detail-card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 252, 248, 0.9);
        box-shadow: var(--shadow);
      }

      .detail-card h4 {
        margin: 0 0 12px;
        font-size: 0.98rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .meta-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }

      .meta-row {
        display: block;
        flex: 0 1 320px;
        width: min(100%, 320px);
        padding: 16px 18px;
        border: 1px solid rgba(58, 43, 28, 0.08);
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(249, 243, 235, 0.92));
        align-items: start;
        min-height: 100%;
      }

      .meta-row strong {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.92rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .meta-row div {
        line-height: 1.7;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }

      .preview-card {
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .preview-card img {
        display: block;
        width: 100%;
        height: auto;
      }

      .preview-card span {
        display: block;
        padding: 10px 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .analysis-list {
        display: grid;
        gap: 14px;
      }

      .abstract-card {
        margin-top: 18px;
      }

      .abstract-text {
        margin: 0;
        line-height: 1.8;
        color: var(--text);
      }

      .analysis-item {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255, 253, 249, 0.92);
        width: 100%;
        min-width: 0;
        overflow: hidden;
      }

      .analysis-item h5 {
        margin: 0 0 12px;
        font-size: 1.02rem;
      }

      .analysis-conclusion {
        margin: 0 0 12px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(181, 95, 52, 0.08);
        line-height: 1.75;
      }

      .analysis-points {
        display: grid;
        gap: 8px;
        width: min(100%, 760px);
        margin: 0 auto;
        justify-items: start;
      }

      .analysis-line {
        margin: 0;
        width: 100%;
        line-height: 1.7;
        text-align: left;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .analysis-line.bullet {
        padding-left: 16px;
        position: relative;
      }

      .analysis-line.bullet::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.75em;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
      }

      .analysis-line.indent-1 {
        padding-left: 28px;
      }

      .analysis-line.indent-2 {
        padding-left: 40px;
      }

      .detail-loading {
        padding: 56px 20px;
        text-align: center;
        color: var(--muted);
      }

      .detail-error {
        padding: 24px;
        border-radius: 22px;
        background: rgba(255, 245, 240, 0.94);
        color: #8b4a2d;
      }

      .scroll-top-button {
        position: fixed;
        right: 34px;
        bottom: 30px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border: 1px solid rgba(181, 95, 52, 0.22);
        border-radius: 999px;
        background: rgba(255, 250, 242, 0.92);
        color: var(--accent);
        font: inherit;
        box-shadow: 0 18px 36px rgba(48, 34, 22, 0.14);
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 180ms ease, transform 180ms ease,
          border-color 180ms ease, background 180ms ease;
        z-index: 41;
      }

      .scroll-top-button.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .scroll-top-button:hover {
        border-color: rgba(181, 95, 52, 0.4);
        background: rgba(255, 246, 233, 0.96);
      }

      @media (max-width: 900px) {
        .shell {
          padding: 20px 14px 32px;
        }

        .layout {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .sidebar {
          position: static;
          padding: 16px;
          order: 1;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .hero {
          flex-direction: column;
          align-items: stretch;
          padding: 22px 18px;
          gap: 16px;
        }

        .hero-brand {
          width: 100%;
        }

        .hero-logo {
          width: 60px;
          height: 60px;
        }

        .repo-link {
          width: 100%;
          justify-content: center;
        }

        .report-head {
          flex-direction: column;
        }

        .content {
          padding: 18px;
          order: 2;
        }

        .detail-sheet {
          inset: 0;
          border-radius: 0;
        }

        .detail-inner {
          padding: 18px 14px 28px;
        }

        .detail-topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .scroll-top-button {
          right: 18px;
          bottom: 18px;
        }
      }

      @media (max-width: 680px) {
        .layout {
          gap: 14px;
        }

        .sidebar,
        .content {
          width: 100%;
        }

        .sidebar {
          padding: 14px;
          max-height: none;
          overflow: visible;
          display: block;
        }

        .content {
          padding: 16px 14px;
        }

        .sidebar h2,
        .content h2 {
          margin-bottom: 10px;
        }

        .hero h1 {
          font-size: 2.2rem;
        }

        .hero-brand {
          width: 100%;
        }

        .hero-title-row {
          gap: 12px;
        }

        .hero-copy p {
          font-size: 0.95rem;
          line-height: 1.55;
        }

        .panel,
        .hero {
          border-radius: 22px;
        }

        .report-list {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          overflow: visible;
          margin: 0;
          padding: 0;
          gap: 8px;
        }

        .report-item {
          padding: 10px 8px;
          min-height: 68px;
          width: 100%;
        }

        .report-item strong {
          margin-bottom: 2px;
          font-size: 0.88rem;
        }

        .report-item span {
          display: block;
          font-size: 0.76rem;
          line-height: 1.35;
        }

        .summary {
          margin-bottom: 10px;
        }

        .report-head {
          margin-bottom: 14px;
        }

        .report-head h3 {
          font-size: 1.9rem;
        }

        .report-head a {
          align-self: flex-start;
        }

        .stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 10px;
        }

        .stat {
          padding: 12px 10px;
          text-align: center;
        }

        .stat strong {
          font-size: 1.15rem;
        }

        th,
        td {
          padding: 10px 12px;
          font-size: 0.9rem;
        }

        .table-wrap {
          display: none;
        }

        .papers-mobile {
          display: block;
        }

        .detail-topbar {
          position: sticky;
          top: 0;
          z-index: 2;
          padding-bottom: 8px;
          background: linear-gradient(
            180deg,
            rgba(248, 241, 231, 0.96),
            rgba(248, 241, 231, 0.82),
            transparent
          );
          backdrop-filter: blur(8px);
        }

        .detail-hero,
        .detail-card,
        .analysis-item {
          padding: 16px;
          border-radius: 18px;
        }

        .detail-title {
          font-size: 1.8rem;
          line-height: 1.08;
        }

        .detail-subtitle {
          font-size: 0.95rem;
          line-height: 1.65;
        }

        .detail-hero .tag-row {
          gap: 8px;
        }

        .detail-hero .tag-row a,
        .chip,
        .back-button,
        .ghost-link {
          font-size: 0.9rem;
        }

        .meta-row {
          width: 100%;
          flex-basis: 100%;
        }

        .preview-grid {
          grid-template-columns: 1fr;
        }

        .analysis-item h5 {
          font-size: 0.98rem;
        }

        .analysis-conclusion {
          padding: 12px 14px;
        }

        .analysis-points {
          width: 100%;
        }

        .analysis-item,
        .analysis-conclusion,
        .analysis-points {
          max-width: 100%;
        }

        .analysis-line.indent-1 {
          padding-left: 22px;
        }

        .analysis-line.indent-2 {
          padding-left: 30px;
        }

        .scroll-top-button {
          right: 14px;
          bottom: 14px;
          padding: 10px 14px;
          font-size: 0.9rem;
        }
      }

      @media (max-width: 520px) {
        .shell {
          padding: 16px 10px 26px;
        }

        .report-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .hero,
        .sidebar,

    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script>
      // Change presentation in place so date, search, and loaded content survive.
      const viewToggle = document.getElementById("viewToggle");
      function applyViewMode(mode) {
        const classic = mode === "classic";
        document.getElementById("appBody").classList.toggle("classic-view", classic);
        viewToggle.setAttribute("aria-checked", String(classic));
        viewToggle.setAttribute("title", classic ? "当前为经典版，点击切换阅读版" : "当前为阅读版，点击切换经典版");
      }
      let viewMode = "reading";
      try { viewMode = localStorage.getItem("rs-paperclaw:view-mode") === "classic" ? "classic" : "reading"; } catch {}
      applyViewMode(viewMode);
      viewToggle.addEventListener("click", () => {
        viewMode = viewMode === "classic" ? "reading" : "classic";
        applyViewMode(viewMode);
        try { localStorage.setItem("rs-paperclaw:view-mode", viewMode); } catch {}
      });
      const loadSummary = document.getElementById("loadSummary");
      const reportList = document.getElementById("reportList");
      const reportDetail = document.getElementById("reportDetail");
      const repoStars = document.getElementById("repoStars");
      const paperOverlay = document.getElementById("paperOverlay");
      const paperOverlayBackdrop = document.getElementById("paperOverlayBackdrop");
      const detailSheet = paperOverlay.querySelector(".detail-sheet");
      const backButton = document.getElementById("backButton");
      const issueExternalLink = document.getElementById("issueExternalLink");
      const paperDetail = document.getElementById("paperDetail");
      const scrollTopButton = document.getElementById("scrollTopButton");
      const DEFAULT_REPORT_BASE =
        "./daily_reports";
      const REMOTE_REPORT_BASE = "https://raw.githubusercontent.com/thinson/RS-PaperClaw/main/daily_reports";
      const REQUEST_TIMEOUT_MS = 10000;
      const reportCache = new Map();
      let selectionVersion = 0;
      let indexNotice = "";
      let selectedMonth = "";
      const LOOKBACK_DAYS = 8;
      const REPORT_BATCH_SIZE = 15;
      const issueCache = new Map();
      let issueLoadVersion = 0;
      let allReports = [];
      let currentReportDate = "";
      let currentSummaryText = "";
      let visibleReportCount = REPORT_BATCH_SIZE;
      let overlayHistoryActive = false;
      const REPO_API_URL = "https://api.github.com/repos/thinson/RS-PaperClaw";
      const REPO_WEB_URL = "https://github.com/thinson/RS-PaperClaw";
      function splitTableRow(row) {
        const stripped = row.trim().replace(/^\|/, "").replace(/\|$/, "");
        const cells = [];
        let current = "";

        for (let index = 0; index < stripped.length; index += 1) {
          const char = stripped[index];
          if (char === "\\" && stripped[index + 1] === "|") {
            current += "|";
            index += 1;
            continue;
          }
          if (char === "|") {
            cells.push(current.trim());
            current = "";
            continue;
          }
          current += char;
        }

        cells.push(current.trim());
        return cells;
      }

      function escapeHtml(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function parseInlineMarkdown(text) {
        if (!text) return "";
        return escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(
            /\[([^\]]+)\]\(([^)]+)\)/g,
            (_, label, url) =>
              `<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${label}</a>`
          )
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      function stripMarkdown(text) {
        return String(text || "")
          .replace(/\*\*([^*]+)\*\*/g, "$1")
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1")
          .replace(/`([^`]+)`/g, "$1")
          .trim();
      }

      function extractFirstLink(text) {
        const match = String(text || "").match(/\[([^\]]+)\]\(([^)]+)\)/);
        return match ? match[2] : "";
      }

      function extractMarkdownLinks(text) {
        return [...String(text || "").matchAll(/\[([^\]]+)\]\(([^)]+)\)/g)].map(
          (match) => ({
            label: match[1].trim(),
            url: match[2].trim(),
          })
        );
      }

      function extractSection(block, title) {
        const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp(
          `^##\\s+${escaped}\\s*$\\n?([\\s\\S]*?)(?=^##\\s+|^---\\s*$|(?![\\s\\S]))`,
          "m"
        );
        const match = block.match(pattern);
        return match ? match[1].trim() : "";
      }

      function parseParagraphs(section) {
        return section
          .split(/\n\s*\n/)
          .map((part) => part.replace(/\n/g, " ").trim())
          .filter(Boolean);
      }

      function parseListItems(section) {
        return section
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => /^[-*]\s+/.test(line))
          .map((line) => line.replace(/^[-*]\s+/, "").trim());
      }

      function parseStats(text) {
        const numbers = [...text.matchAll(/(\d+)\s*篇/g)].map((item) => item[1]);
        return [
          { label: "候选论文", value: numbers[0] || "-" },
          { label: "匹配论文", value: numbers[1] || "-" },
          { label: "纳入日报", value: numbers[2] || "-" },
        ];
      }

      function isPlaceholderValue(value) {
        const plain = stripMarkdown(value).replace(/\s+/g, " ");
        return plain === "" || plain === "-" || plain === "—";
      }

      function parseArticles(section) {
        const lines = section
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line.startsWith("|"));

        if (lines.length < 3) return [];

        const headers = splitTableRow(lines[0]).map((cell) => stripMarkdown(cell));
        const rows = lines.slice(2).map(splitTableRow);
        return rows
          .map((cells) => {
            const row = Object.fromEntries(headers.map((header, index) => [header, cells[index] || ""]));
            const titleCell = row["标题"] || row["Title"] || cells[0] || "";
            const authorsCell = row["作者"] || row["Authors"] || cells[1] || "";
            const institutionCell =
              row["单位"] || row["机构"] || row["Institution"] || row["Affiliation"] || "";
            const summaryCell =
              row["一句话概括"] || row["摘要"] || row["Summary"] || cells[Math.min(cells.length - 2, 3)] || "";
            const issueCell = row["Issue"] || cells[cells.length - 1] || "";

            return {
              title: parseInlineMarkdown(titleCell),
              titleText: stripMarkdown(titleCell),
              authors: authorsCell,
              institution: institutionCell,
              summary: summaryCell,
              issue: parseInlineMarkdown(issueCell),
              issueText: stripMarkdown(issueCell),
              issueUrl: extractFirstLink(issueCell),
            };
          })
          .filter(
            (item) =>
              !(
                isPlaceholderValue(item.titleText) &&
                isPlaceholderValue(item.authors) &&
                isPlaceholderValue(item.issueText)
              )
          );
      }

      function formatDate(raw) {
        return `${raw.slice(0, 4)}-${raw.slice(4, 6)}-${raw.slice(6, 8)}`;
      }

      function buildReportUrl(basePath, date) {
        return `${basePath}/${date.slice(0, 6)}/${date}.md`;
      }

      function parseRequestedPaperIssueUrl() {
        const match = window.location.hash.match(/^#paper-(\d+)$/);
        if (!match) return "";
        return `${REPO_WEB_URL}/issues/${match[1]}`;
      }

      function parseRequestedReportDate() {
        const date = new URLSearchParams(window.location.search).get("date") || "";
        return /^\d{8}$/.test(date) ? date : "";
      }

      function updateReportUrl(date, options = {}) {
        const { replace = false } = options;
        const url = new URL(window.location.href);
        if (date) {
          url.searchParams.set("date", date);
        } else {
          url.searchParams.delete("date");
        }
        const state = {
          ...(history.state || {}),
          paperOverlay: Boolean(history.state && history.state.paperOverlay),
          reportDate: date || "",
        };
        const target = `${url.pathname}${url.search}${url.hash}`;
        history[replace ? "replaceState" : "pushState"](state, "", target);
      }

      function ensureVisibleForDate(reports, date) {
        const index = reports.filter((item) => !selectedMonth || item.date.startsWith(selectedMonth))
          .findIndex((item) => item.date === date);
        if (index < 0) return;
        const requiredCount =
          Math.ceil((index + 1) / REPORT_BATCH_SIZE) * REPORT_BATCH_SIZE;
        visibleReportCount = Math.max(visibleReportCount, requiredCount);
      }

      async function fetchAvailableReportDates() {
        try {
          const payload = JSON.parse(await fetchText(`${DEFAULT_REPORT_BASE}/index.json`));
          if (!Array.isArray(payload.dates) || !payload.dates.length ||
              !payload.dates.every((date) => /^\d{8}$/.test(date))) {
            throw new Error("日报目录格式不正确");
          }
          const dates = [...new Set(payload.dates)].sort().reverse();
          saveCache("report-dates", dates);
          return dates;
        } catch (error) {
          const cached = readCache("report-dates");
          if (Array.isArray(cached) && cached.length && cached.every((date) => /^\d{8}$/.test(date))) {
            indexNotice = "目录更新失败，正在使用缓存目录。";
            return [...new Set(cached)].sort().reverse();
          }
          throw error;
        }
      }

      function readCache(key) {
        try { return JSON.parse(localStorage.getItem(`rs-paperclaw:${key}`)); }
        catch { return null; }
      }

      function saveCache(key, value) {
        try { localStorage.setItem(`rs-paperclaw:${key}`, JSON.stringify(value)); }
        catch { /* Reading remains available if storage is disabled or full. */ }
      }

      async function fetchText(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
        try {
          const response = await fetch(url, { signal: controller.signal, cache: "no-cache" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.text();
        } catch (error) {
          if (error.name === "AbortError") throw new Error("请求超时（10 秒）");
          throw error;
        } finally { clearTimeout(timer); }
      }

      function toDisplayUrl(rawUrl) {
        const match = rawUrl.match(
          /^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/
        );
        if (!match) return rawUrl;
        return `https://github.com/${match[1]}/${match[2]}/blob/${match[3]}/${match[4]}`;
      }

      function parseDailyReport(markdown, sourceUrl, fallbackDate) {
        const normalized = markdown.replace(/\r\n/g, "\n");
        const headingMatch =
          normalized.match(/^#\s+日报\s+(\d{8})/m) ||
          normalized.match(/^#\s+(\d{8})/m);
        const date = headingMatch ? headingMatch[1] : fallbackDate;
        const overviewSection = extractSection(normalized, "📌 今日概况");
        const highlightsSection = extractSection(normalized, "✨ 今日亮点");
        const articlesSection = extractSection(normalized, "🗂 今日文章列表");
        const observationsSection = extractSection(normalized, "🔎 观察");
        const stats = parseStats(overviewSection);
        const includedCount = Number.parseInt(stats[2].value, 10);

        return {
          date,
          rawUrl: sourceUrl,
          fileUrl: toDisplayUrl(sourceUrl),
          overview: parseParagraphs(overviewSection),
          highlights: parseListItems(highlightsSection),
          observations: parseListItems(observationsSection),
          stats,
          articles: parseArticles(articlesSection),
          includedCount: Number.isFinite(includedCount) ? includedCount : 0,
        };
      }

      function toIssueApiUrl(issueUrl) {
        if (!issueUrl) return "";
        if (issueUrl.includes("api.github.com/repos/")) return issueUrl;

        const match = issueUrl.match(
          /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/issues\/(\d+)/
        );
        if (!match) return issueUrl;
        return `https://api.github.com/repos/${match[1]}/${match[2]}/issues/${match[3]}`;
      }

      function normalizeKeyLabel(text) {
        return stripMarkdown(text).replace(/[:：]\s*$/, "").trim();
      }

      function parseMetadataTable(section) {
        const lines = section
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line.startsWith("|"));

        if (lines.length < 3) return [];

        return lines
          .slice(2)
          .map(splitTableRow)
          .filter((cells) => cells.length >= 2)
          .map((cells) => ({
            key: normalizeKeyLabel(cells[0]),
            value: cells.slice(1).join(" | ").trim(),
          }));
      }

      function parseIssueImages(section) {
        return [...String(section || "").matchAll(/<img[^>]+src="([^"]+)"/g)].map(
          (match, index) => ({
            src: match[1],
            label: `Preview ${index + 1}`,
          })
        );
      }

      function parseAnalysisLines(text) {
        return String(text || "")
          .split("\n")
          .map((line) => {
            const leadingSpaces = (line.match(/^(\s*)/) || ["", ""])[1].length;
            const trimmed = line.trim();
            if (!trimmed) return null;

            const bulletMatch = trimmed.match(/^([-*]|\d+\.)\s+(.+)$/);
            return {
              indent: Math.min(2, Math.floor(leadingSpaces / 2)),
              bullet: Boolean(bulletMatch),
              text: bulletMatch ? bulletMatch[2] : trimmed,
            };
          })
          .filter(Boolean);
      }

      function parseAnalysisItems(section) {
        const normalized = String(section || "").trim();
        if (!normalized) return [];

        return [...normalized.matchAll(/^###\s+(.+)\n([\s\S]*?)(?=^###\s+|(?![\s\S]))/gm)].map(
          (match) => {
            const body = match[2].trim();
            const conclusionMatch = body.match(/^🎯\s*结论[:：]\s*([\s\S]*?)(?=\n(?:📌|$))/m);
            const pointsMatch = body.match(/📌\s*要点[:：]\s*\n?([\s\S]*)$/m);

            return {
              heading: match[1].trim(),
              conclusion: conclusionMatch ? conclusionMatch[1].trim() : "",
              points: parseAnalysisLines(pointsMatch ? pointsMatch[1] : body),
            };
          }
        );
      }

      function parseIssueBody(body) {
        const normalized = String(body || "").replace(/\r\n/g, "\n");
        const metadata = parseMetadataTable(extractSection(normalized, "📋 基础信息"));
        const tldr = parseListItems(extractSection(normalized, "🧠 TL;DR（速览）"));
        const previews = parseIssueImages(extractSection(normalized, "📸 论文概览"));
        const analysis = parseAnalysisItems(extractSection(normalized, "❓ 10 问题深度分析"));
        const metadataMap = Object.fromEntries(metadata.map((item) => [item.key, item.value]));

        return {
          metadata,
          metadataMap,
          tldr: tldr.length ? tldr : metadataMap["TL;DR"] ? [metadataMap["TL;DR"]] : [],
          previews,
          analysis,
        };
      }

      function formatDateTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatStarCount(count) {
        if (!Number.isFinite(count) || count === 0) return "-";
        if (count >= 1000) {
          return `${(count / 1000).toFixed(count >= 10000 ? 0 : 1).replace(/\.0$/, "")}k stars`;
        }
        return `${count} stars`;
      }

      function renderMetadataRows(metadata, labels) {
        const rows = metadata.filter(
          (item) =>
            !["标签", "摘要", "arXiv", "标题", "论文标题", "TL;DR"].includes(item.key)
        );
        const renderedRows = rows.length
          ? rows
              .map(
                (item) => `
                  <div class="meta-row">
                    <strong>${escapeHtml(item.key)}</strong>
                    <div>${parseInlineMarkdown(item.value)}</div>
                  </div>
                `
              )
              .join("")
          : '<div class="meta-row"><strong>信息</strong><div>暂无基础信息。</div></div>';

        const chips = labels.length
          ? `
              <div class="meta-row">
                <strong>标签</strong>
                <div class="tag-row">${labels
                  .map((label) => `<span class="chip">${escapeHtml(label)}</span>`)
                  .join("")}</div>
              </div>
            `
          : "";

        return renderedRows + chips;
      }

      function renderAnalysisPoints(points) {
        if (!points.length) {
          return '<p class="analysis-line">暂无进一步解析。</p>';
        }

        return points
          .map(
            (point) => `
              <p class="analysis-line ${point.bullet ? "bullet" : ""} indent-${point.indent}">
                ${parseInlineMarkdown(point.text)}
              </p>
            `
          )
          .join("");
      }

      function renderIssueDetail(issue) {
        const parsed = parseIssueBody(issue.body || "");
        const abstractValue = parsed.metadataMap["摘要"] || "";
        const arxivValue = parsed.metadataMap["arXiv"] || "";
        const arxivLink = extractMarkdownLinks(arxivValue).find((item) =>
          /^(abs|arxiv)$/i.test(item.label)
        );
        const labelNames = (issue.labels || []).map((label) => label.name);
        const previewsHtml = parsed.previews.length
          ? `
              <div class="detail-card" id="detail-previews">
                <h4>论文预览</h4>
                <div class="preview-grid">
                  ${parsed.previews
                    .map(
                      (image) => `
                        <figure class="preview-card">
                          <a href="${escapeHtml(image.src)}" target="_blank" rel="noreferrer"><img loading="lazy" decoding="async" src="${escapeHtml(image.src)}" alt="${escapeHtml(image.label)}" /></a>
                          <span>${escapeHtml(image.label)}</span>
                        </figure>
                      `
                    )
                    .join("")}
                </div>
              </div>
            `
          : "";

        const analysisHtml = parsed.analysis.length
          ? parsed.analysis
              .map(
                (item, index) => `
                  <article class="analysis-item" id="analysis-${index}">
                    <h5>${escapeHtml(item.heading)}</h5>
                    ${
                      item.conclusion
                        ? `<p class="analysis-conclusion">${parseInlineMarkdown(item.conclusion)}</p>`
                        : ""
                    }
                    <div class="analysis-points">
                      ${renderAnalysisPoints(item.points)}
                    </div>
                  </article>
                `
              )
              .join("")
          : '<div class="analysis-item"><h5>解析</h5><p class="analysis-line">该 issue 暂无结构化分析内容。</p></div>';
        const abstractHtml = abstractValue
          ? `
              <section class="detail-card abstract-card" id="detail-abstract">
                <h4>摘要</h4>
                <p class="abstract-text">${parseInlineMarkdown(abstractValue)}</p>
              </section>
            `
          : "";

        paperDetail.innerHTML = `
          <section class="detail-hero">
            <p class="detail-kicker">论文分析 · #${issue.number}</p>
            <h1 class="detail-title">${escapeHtml((issue.title || "论文详情").replace(/^\[\d{8}\]\s*/, ""))}</h1>
            <div class="tag-row">
              ${
                arxivLink
                  ? `<a href="${escapeHtml(arxivLink.url)}" target="_blank" rel="noreferrer">arXiv</a>`
                  : ""
              }
              <span class="chip">更新于 ${escapeHtml(formatDateTime(issue.updated_at))}</span>
            </div>
          </section>

          <section class="detail-grid" id="detail-info">
            <div class="detail-card">
              <h4>基础信息</h4>
              <div class="meta-grid">
                ${renderMetadataRows(parsed.metadata, labelNames)}
              </div>
            </div>
          </section>

          ${parsed.tldr.length ? `<section class="detail-card" id="detail-tldr"><h4>核心结论</h4><ul class="detail-tldr">${parsed.tldr.map((line) => `<li>${parseInlineMarkdown(line)}</li>`).join("")}</ul></section>` : ""}
          ${abstractHtml}
          ${previewsHtml}

          <section class="detail-card" id="detail-analysis">
            <div class="analysis-heading"><h4>深度分析</h4>
              ${parsed.analysis.length ? `<select class="analysis-jump" aria-label="跳转到分析问题"><option value="">选择分析问题…</option>${parsed.analysis.map((item, index) => `<option value="analysis-${index}">${escapeHtml(item.heading)}</option>`).join("")}</select>` : ""}
            </div>
            <div class="analysis-list">
              ${analysisHtml}
            </div>
          </section>
        `;
        const sections = [["detail-info", "基础信息"], ...(parsed.tldr.length ? [["detail-tldr", "核心结论"]] : []), ...(abstractValue ? [["detail-abstract", "摘要"]] : []), ...(parsed.previews.length ? [["detail-previews", "论文预览"]] : []), ["detail-analysis", "深度分析"]];
        const nav = document.getElementById("detailNav");
        nav.innerHTML = sections.map(([id, label]) => `<button type="button" data-section="${id}">${label}</button>`).join("");
        nav.querySelectorAll("button").forEach((button) => button.addEventListener("click", () => {
          document.getElementById(button.dataset.section).scrollIntoView({ block: "start" });
        }));
        const jump = paperDetail.querySelector(".analysis-jump");
        if (jump) jump.addEventListener("change", (event) => {
          if (event.target.value) document.getElementById(event.target.value).scrollIntoView({ block: "start" });
        });
      }

      function updateScrollTopButton() {
        const visible = detailSheet.scrollTop > 280 && paperOverlay.classList.contains("open");
        scrollTopButton.classList.toggle("visible", visible);
        scrollTopButton.tabIndex = visible ? 0 : -1;
        scrollTopButton.setAttribute("aria-hidden", String(!visible));
      }

      function clearOverlayHistoryState() {
        if (history.state && history.state.paperOverlay) {
          history.replaceState(
            {
              ...(history.state || {}),
              paperOverlay: false,
              reportDate: currentReportDate || parseRequestedReportDate(),
            },
            "",
            `${window.location.pathname}${window.location.search}`
          );
        }
      }

      function setOverlayOpen(isOpen) {
        paperOverlay.classList.toggle("open", isOpen);
        document.body.classList.toggle("paper-open", isOpen);
        if (!isOpen) issueLoadVersion += 1;
        paperOverlay.setAttribute("aria-hidden", isOpen ? "false" : "true");
        if (!isOpen) {
          scrollTopButton.classList.remove("visible");
          scrollTopButton.tabIndex = -1;
          scrollTopButton.setAttribute("aria-hidden", "true");
        }
      }

      function closePaperOverlay(options = {}) {
        const { fromHistory = false, resetHistory = false } = options;
        if (!fromHistory && overlayHistoryActive && history.length > 1) {
          history.back();
          return;
        }

        overlayHistoryActive = false;
        setOverlayOpen(false);
        if (resetHistory) {
          clearOverlayHistoryState();
        }
      }

      function renderIssueStatus(issueUrl, title, error = null) {
        const failed = Boolean(error);
        const message = String(error?.message || "");
        const timedOut = message.includes("超时");
        const explanation = timedOut
          ? "连接时间较长，本次请求已超时。可以重试，或直接打开论文报告。"
          : /HTTP (403|429)/.test(message)
            ? "报告服务暂时限制了访问，请稍后重试，或在 GitHub 查看。"
            : message.includes("HTTP 404")
              ? "暂时找不到这份报告。可以在 GitHub 确认报告是否仍可访问。"
              : "暂时无法连接报告服务。请检查网络后重试，也可以直接在 GitHub 查看。";
        paperDetail.innerHTML = `
          <section class="issue-state" role="${failed ? "alert" : "status"}" aria-live="polite">
            <div class="issue-state-icon ${failed ? "" : "is-loading"}" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                ${failed ? '<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>' : '<path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/>'}
              </svg>
            </div>
            <h2>${failed ? timedOut ? "加载超时" : "暂时无法加载论文" : "正在加载论文"}</h2>
            <p class="issue-state-title">${escapeHtml(title || "论文详情")}</p>
            <p class="issue-state-message">${failed ? explanation : "正在获取阅读报告，请稍候。网络较慢时可能需要几秒钟。"}</p>
            <div class="issue-state-actions">
              ${failed ? '<button type="button" id="retryIssue" class="issue-retry"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg>重新加载</button>' : ""}
              <a href="${escapeHtml(issueUrl)}" target="_blank" rel="noreferrer" class="issue-source">在 GitHub 查看 ↗</a>
            </div>
            ${failed ? `<details class="issue-error-details"><summary>错误详情</summary><p>${escapeHtml(message)}</p></details>` : '<div class="issue-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>'}
          </section>`;
      }

      async function openPaperDetail(issueUrl, fallbackTitle, options = {}) {
        const { skipHistory = false } = options;
        if (!issueUrl) return;
        const loadVersion = ++issueLoadVersion;
        document.getElementById("detailNav").innerHTML = "";

        if (!skipHistory) {
          const issueNumberMatch = issueUrl.match(/\/issues\/(\d+)/);
          const targetHash = issueNumberMatch
            ? `#paper-${issueNumberMatch[1]}`
            : "#paper";

          if (!overlayHistoryActive) {
            history.pushState(
              {
                ...(history.state || {}),
                paperOverlay: true,
                issueUrl,
                reportDate: currentReportDate,
              },
              "",
              targetHash
            );
            overlayHistoryActive = true;
          } else {
            history.replaceState(
              {
                ...(history.state || {}),
                paperOverlay: true,
                issueUrl,
                reportDate: currentReportDate,
              },
              "",
              targetHash
            );
          }
        } else {
          overlayHistoryActive = true;
        }

        setOverlayOpen(true);
        detailSheet.scrollTo({ top: 0, behavior: "auto" });
        updateScrollTopButton();
        issueExternalLink.href = issueUrl;
        renderIssueStatus(issueUrl, fallbackTitle);

        const apiUrl = toIssueApiUrl(issueUrl);
        try {
          let issue = issueCache.get(apiUrl);
          if (!issue) {
            issue = JSON.parse(await fetchText(apiUrl));
            issueCache.set(apiUrl, issue);
          }

          if (loadVersion !== issueLoadVersion) return;
          issueExternalLink.href = issue.html_url || issueUrl;
          renderIssueDetail(issue);
        } catch (error) {
          if (loadVersion !== issueLoadVersion) return;
          renderIssueStatus(issueUrl, fallbackTitle, error);
          document.getElementById("retryIssue").addEventListener("click", () => openPaperDetail(issueUrl, fallbackTitle, { skipHistory: true }));
        }
      }

      function renderList(reports, activeDate, summaryText) {
        loadSummary.textContent = summaryText;

        if (!reports.length) {
          reportList.innerHTML =
            '<div class="status">最近时间窗口内没有可展示的日报。</div>';
          return;
        }

        const monthSelect = document.getElementById("reportMonth");
        const months = [...new Set(reports.map((report) => report.date.slice(0, 6)))];
        monthSelect.innerHTML = '<option value="">全部月份</option>' + months.map((month) =>
          `<option value="${month}">${month.slice(0, 4)} 年 ${month.slice(4)} 月</option>`).join("");
        monthSelect.value = selectedMonth;
        const mobileDate = document.getElementById("mobileDate");
        mobileDate.innerHTML = reports.map((report) => `<option value="${report.date}">${formatDate(report.date)}${report.date === reports[0].date ? " · 最新日报" : ""}</option>`).join("");
        mobileDate.value = activeDate;
        const filteredReports = reports.filter((report) => !selectedMonth || report.date.startsWith(selectedMonth));
        const visibleReports = filteredReports.slice(0, visibleReportCount);
        const canLoadMore = visibleReportCount < filteredReports.length;

        reportList.innerHTML = visibleReports
          .map(
            (report) => `
              <button class="report-item ${
                report.date === activeDate ? "active" : ""
              }" data-date="${report.date}" aria-label="${formatDate(report.date)}${report.date === reports[0].date ? " 最新日报" : ""}" title="${formatDate(report.date)}" aria-pressed="${report.date === activeDate}" type="button">
                <strong class="date-full">${formatDate(report.date)}</strong>
                <strong class="date-day" aria-hidden="true">${report.date.slice(6)}</strong>
                <span class="date-meta">${report.date === reports[0].date ? "最新" : report.includedCount == null ? "" : `${report.includedCount} 篇`}</span>
              </button>
            `
          )
          .join("") +
          `
            <${
              canLoadMore ? "button" : "a"
            }
              class="report-item more"
              aria-label="${canLoadMore ? "展开更早日报" : "查看完整归档"}" title="${canLoadMore ? "展开更早日报" : "查看完整归档"}"
              ${
                canLoadMore
                  ? 'id="loadMoreReports" type="button"'
                  : 'href="https://github.com/thinson/RS-PaperClaw/tree/main/daily_reports" target="_blank" rel="noreferrer"'
              }
            >
              <strong>${canLoadMore ? "展开更早日报 ↓" : "查看完整归档 ↗"}</strong>
              <span class="rail-more" aria-hidden="true">${canLoadMore ? "···" : "↗"}</span>
              <span>${
                canLoadMore ? "每次展开 15 天" : "GitHub"
              }</span>
            </${canLoadMore ? "button" : "a"}>
          `;

        reportList.querySelectorAll(".report-item").forEach((button) => {
          if (button.tagName === "A" || button.id === "loadMoreReports") return;
          button.addEventListener("click", () =>
            selectReport(button.dataset.date)
          );
        });

        const loadMoreButton = document.getElementById("loadMoreReports");
        if (loadMoreButton) {
          loadMoreButton.addEventListener("click", () => {
            visibleReportCount = Math.min(
              filteredReports.length,
              visibleReportCount + REPORT_BATCH_SIZE
            );
            renderList(reports, activeDate, summaryText);
          });
        }
      }

      function renderReport(reports, date, summaryText, options = {}) {
        const { skipUrlUpdate = false, replaceUrl = false } = options;
        const report = reports.find((item) => item.date === date) || reports[0];
        if (!report) {
          reportDetail.innerHTML = '<div class="empty">没有可展示的日报。</div>';
          return;
        }
        ensureVisibleForDate(reports, report.date);
        currentReportDate = report.date;
        currentSummaryText = summaryText;
        if (!skipUrlUpdate) updateReportUrl(report.date, { replace: replaceUrl });
        renderList(reports, report.date, summaryText);
        const hasContent = (text) => text && !/^(暂无|无[。.]?$|无明显)/.test(text.trim());
        const overview = report.overview.filter(hasContent);
        // Counts are already visible above the summary.
        const narrative = overview.filter((text) => !/^今日共检索候选论文/.test(text));
        const rows = report.articles.map((item) => {
          const title = (item.titleText || "未命名论文").replace(/^\[\d{8}\]\s*/, "");
          const search = [title, item.authors, item.institution, item.summary].join(" ").toLowerCase();
          return `<tr class="reading-row" data-search="${escapeHtml(search)}" ${item.issueUrl ? `data-issue-url="${escapeHtml(item.issueUrl)}" data-title="${escapeHtml(title)}"` : ""}>
            <td class="reading-title">${item.issueUrl ? `<button type="button" class="table-title-link" data-issue-url="${escapeHtml(item.issueUrl)}" data-title="${escapeHtml(title)}" aria-label="阅读分析：${escapeHtml(title)}"><span class="cell-text" title="${escapeHtml(title)}">${escapeHtml(title)}</span></button>` : `<span class="cell-text" title="${escapeHtml(title)}">${escapeHtml(title)}</span>`}</td>
            <td><span class="mobile-cell-label">作者</span><span class="cell-text" title="${escapeHtml(item.authors || "作者暂缺")}">${escapeHtml(item.authors || "作者暂缺")}</span></td>
            <td><span class="mobile-cell-label">单位</span><span class="cell-text" title="${escapeHtml(item.institution || "单位暂缺")}">${escapeHtml(item.institution || "单位暂缺")}</span></td>
            <td><span class="mobile-cell-label">摘要</span><span class="cell-text" title="${escapeHtml(item.summary || "暂无摘要")}">${escapeHtml(item.summary || "暂无摘要")}</span></td>
          </tr>`;
        }).join("");
        reportDetail.innerHTML = `
          <div class="report-head">
            <div><h3>${formatDate(report.date)}</h3></div>
            <div class="report-head-actions"><a href="${escapeHtml(report.fileUrl)}" target="_blank" rel="noreferrer">原始日报 ↗</a></div>
          </div>
          <div class="stats">${report.stats.map((stat) => `<div class="stat"><span>${escapeHtml(stat.label)}</span><strong>${escapeHtml(stat.value)}</strong></div>`).join("")}</div>
          ${narrative.length ? `<section class="section"><h2>今日速览</h2><div class="overview-copy">${narrative.map((line) => `<p>${escapeHtml(line)}</p>`).join("")}</div></section>` : ""}
          <section class="section">
            <div class="paper-toolbar"><h2>精选论文 <span class="paper-total">${report.articles.length} 篇</span></h2>
              <input class="paper-search" type="search" aria-label="搜索当日日报论文" placeholder="搜索当天标题、摘要、作者…" />
            </div>
            <p class="table-guide">点击论文所在行阅读分析 · 长文本悬停查看全文</p>
            <table class="reading-table" aria-label="当日论文总览">
              <colgroup><col style="width:34%"><col style="width:20%"><col style="width:22%"><col style="width:24%"></colgroup>
              <thead><tr><th scope="col">论文标题</th><th scope="col">作者</th><th scope="col">单位</th><th scope="col">一句话摘要</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <p class="search-empty" role="status" ${report.articles.length ? "hidden" : ""}>${report.articles.length ? "没有匹配的论文，试试其他关键词。" : "当天暂无收录论文。"}</p>
          </section>
        `;
        reportDetail.querySelector(".paper-search").addEventListener("input", (event) => {
          const query = event.target.value.trim().toLowerCase();
          let count = 0;
          reportDetail.querySelectorAll(".reading-row").forEach((card) => {
            card.hidden = !card.dataset.search.includes(query);
            if (!card.hidden) count += 1;
          });
          reportDetail.querySelector(".paper-total").textContent = query ? `${count} / ${report.articles.length} 篇` : `${report.articles.length} 篇`;
          reportDetail.querySelector(".search-empty").hidden = count > 0;
        });
      }

      async function fetchReport(basePath, date) {
        const url = buildReportUrl(basePath, date);
        const markdown = await fetchText(url);
        // Reject HTML error pages and malformed assets instead of showing an empty report.
        if (!/^#\s+(?:日报\s+)?\d{8}/m.test(markdown)) {
          throw new Error("日报内容格式不正确");
        }
        const report = parseDailyReport(markdown, buildReportUrl(REMOTE_REPORT_BASE, date), date);
        if (report.date !== date) throw new Error("日报日期与目录不一致");
        reportCache.set(date, report);
        if (currentReportDate === date) saveCache("last-report", { date, markdown });
        return report;
      }

      async function selectReport(date, options = {}) {
        const version = ++selectionVersion;
        if (selectedMonth && !date.startsWith(selectedMonth)) selectedMonth = "";
        currentReportDate = date;
        ensureVisibleForDate(allReports, date);
        if (!options.skipUrlUpdate) updateReportUrl(date, { replace: options.replaceUrl });
        renderList(allReports, date, currentSummaryText);
        const cached = reportCache.get(date);
        const show = (report) => {
          const index = allReports.findIndex((item) => item.date === date);
          if (index >= 0) allReports[index] = report;
          renderReport(allReports, date, currentSummaryText, { skipUrlUpdate: true });
        };
        if (cached) {
          show(cached);
          loadSummary.textContent = currentSummaryText + " 正在检查更新...";
        } else {
          reportDetail.innerHTML = '<div class="empty" role="status">正在下载 ' + formatDate(date) + ' 日报...</div>';
        }
        reportDetail.setAttribute("aria-busy", "true");
        try {
          const report = await fetchReport(DEFAULT_REPORT_BASE, date);
          if (version !== selectionVersion) return;
          show(report);
        } catch (error) {
          if (version !== selectionVersion) return;
          const message = formatDate(date) + " 加载失败：" + error.message;
          if (!cached) reportDetail.innerHTML = '<div class="empty">' + escapeHtml(message) + '</div>';
          loadSummary.textContent = message + (cached ? "。当前显示上次缓存的内容。" : "。可重试或选择其他日期。");
          const retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "重试此日报";
          retry.addEventListener("click", () => selectReport(date, { skipUrlUpdate: true }));
          loadSummary.append(" ", retry);
        } finally {
          if (version === selectionVersion) reportDetail.setAttribute("aria-busy", "false");
        }
      }

      async function loadRepoStars() {
        try {
          const response = await fetch(REPO_API_URL, {
            headers: {
              Accept: "application/vnd.github+json",
            },
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const repo = await response.json();
          repoStars.textContent = formatStarCount(repo.stargazers_count);
        } catch (error) {
          repoStars.textContent = "-";
        }
      }

      async function loadReports() {
        ++selectionVersion;
        indexNotice = "";
        if (window.location.protocol === "file:") {
          loadSummary.textContent = "请通过本地 HTTP 服务打开网页。";
          reportList.innerHTML = '<div class="status">本地文件模式无法读取日报数据。</div>';
          reportDetail.innerHTML = '<div class="empty">在项目根目录运行 <code>python -m http.server 8000</code>，然后打开 <a href="http://localhost:8000/docs/">http://localhost:8000/docs/</a>。</div>';
          return;
        }
        const requestedDate = parseRequestedReportDate();
        loadSummary.textContent = "正在获取日报目录...";
        reportList.innerHTML = '<div class="status" role="status">正在获取日报目录...</div>';
        const saved = readCache("last-report");
        if (saved && /^\d{8}$/.test(saved.date) && typeof saved.markdown === "string") {
          try {
            const report = parseDailyReport(saved.markdown, buildReportUrl(REMOTE_REPORT_BASE, saved.date), saved.date);
            reportCache.set(saved.date, report);
            if (!requestedDate || requestedDate === saved.date) {
              renderReport([report], saved.date, "正在显示缓存，检查日报更新...", { skipUrlUpdate: true });
            }
          } catch { /* Ignore an obsolete or corrupted cache. */ }
        }
        try {
          const dates = await fetchAvailableReportDates();
          visibleReportCount = REPORT_BATCH_SIZE;
          allReports = dates.map((date) => reportCache.get(date) || { date });
          if (requestedDate && !dates.includes(requestedDate)) {
            allReports.push({ date: requestedDate });
            allReports.sort((a, b) => b.date.localeCompare(a.date));
          }
          currentSummaryText = indexNotice + "共 " + dates.length + " 份日报，选择日期即可阅读。";
          await selectReport(requestedDate || dates[0], { replaceUrl: true });
          const requestedIssueUrl = parseRequestedPaperIssueUrl();
          if (requestedIssueUrl) openPaperDetail(requestedIssueUrl, "论文详情", { skipHistory: true });
        } catch (error) {
          loadSummary.textContent = "日报目录加载失败：" + error.message;
          reportList.innerHTML = '<button id="retryReports" class="report-item" type="button">重新加载日报目录</button>';
          document.getElementById("retryReports").addEventListener("click", loadReports);
          if (!reportCache.size) reportDetail.innerHTML = '<div class="empty">无法获取日报目录，请重试。</div>';
        }
      }

      document.getElementById("archiveToggle").addEventListener("click", (event) => {
        const collapsed = document.querySelector(".layout").classList.toggle("archive-collapsed");
        const button = event.currentTarget;
        const label = collapsed ? "展开日期栏" : "收起日期栏";
        button.setAttribute("aria-label", label);
        button.setAttribute("title", label);
        button.setAttribute("aria-expanded", String(!collapsed));
      });
      document.getElementById("reportMonth").addEventListener("change", (event) => {
        selectedMonth = event.target.value;
        visibleReportCount = REPORT_BATCH_SIZE;
        renderList(allReports, currentReportDate, currentSummaryText);
      });
      document.getElementById("mobileDate").addEventListener("change", (event) => {
        if (event.target.value) selectReport(event.target.value);
      });
      detailSheet.addEventListener("scroll", updateScrollTopButton);
      scrollTopButton.addEventListener("click", () => {
        detailSheet.scrollTo({ top: 0, behavior: "smooth" });
      });
      reportDetail.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-issue-url]");
        if (!trigger) return;
        const selection = window.getSelection();
        const row = trigger.closest(".reading-row");
        if (event.detail !== 0 && selection && !selection.isCollapsed && row &&
            (row.contains(selection.anchorNode) || row.contains(selection.focusNode))) return;

        openPaperDetail(
          trigger.getAttribute("data-issue-url"),
          trigger.getAttribute("data-title")
        );
      });
      reportDetail.addEventListener("keydown", (event) => {
        const trigger = event.target.closest("[data-issue-url]");
        if (!trigger) return;

        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openPaperDetail(
            trigger.getAttribute("data-issue-url"),
            trigger.getAttribute("data-title")
          );
        }
      });
      backButton.addEventListener("click", closePaperOverlay);
      paperOverlayBackdrop.addEventListener("click", closePaperOverlay);
      document.addEventListener("keydown", (event) => {
        const activeTag = document.activeElement?.tagName;
        const isEditable =
          activeTag === "INPUT" ||
          activeTag === "TEXTAREA" ||
          document.activeElement?.isContentEditable;

        if (
          paperOverlay.classList.contains("open") &&
          event.key === "Backspace" &&
          !isEditable
        ) {
          event.preventDefault();
          closePaperOverlay();
          return;
        }

        if (event.key === "Escape") {
          closePaperOverlay();
        }
      });
      window.addEventListener("popstate", (event) => {
        const targetDate = parseRequestedReportDate();
        if (allReports.length) {
          const fallbackDate = allReports[0]?.date || "";
          const resolvedDate =
            targetDate && allReports.some((item) => item.date === targetDate)
              ? targetDate
              : fallbackDate;
          if (resolvedDate && resolvedDate !== currentReportDate) {
            selectReport(resolvedDate, {
              skipUrlUpdate: true,
            });
          }
        }

        if (event.state && event.state.paperOverlay) {
          openPaperDetail(event.state.issueUrl, "论文详情", { skipHistory: true });
          return;
        }

        if (paperOverlay.classList.contains("open")) {
          closePaperOverlay({ fromHistory: true });
        }
      });
      window.addEventListener("hashchange", () => {
        const requestedIssueUrl = parseRequestedPaperIssueUrl();
        if (requestedIssueUrl) {
          openPaperDetail(requestedIssueUrl, "论文详情", { skipHistory: true });
          return;
        }

        if (paperOverlay.classList.contains("open")) {
          closePaperOverlay({ fromHistory: true });
        }
      });

      if (!history.state || typeof history.state.paperOverlay === "undefined") {
        history.replaceState(
          {
            paperOverlay: false,
            reportDate: parseRequestedReportDate(),
          },
          "",
          window.location.href
        );
      }

      loadRepoStars();
      loadReports();
    </script>
  </body>
</html>
